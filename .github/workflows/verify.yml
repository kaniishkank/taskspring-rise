name: TaskFlow CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mgg_taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Wait for database initialization
      run: sleep 10

    - name: Run Backend Integration Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        JWT_SECRET: super_secure_ci_test_key_123
      run: |
        cd backend
        npm install
        npx prisma db push
        npm run test

    - name: Seed Database for E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
      run: |
        cd backend
        npm run prisma:seed

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Frontend E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        JWT_SECRET: super_secure_ci_test_key_123
        PORT: 4000
      run: |
        # 1. Install frontend dependencies first
        cd frontend
        npm install
        
        # 2. Start frontend dev server
        npm run dev -- --port 8080 &
        
        # 3. Start backend dev server
        cd ../backend
        npm run dev &
        
        # 4. Stabilize background processes
        sleep 15
        
        # 5. Run tests
        cd ../frontend
        npx playwright test

  build-and-push:
    name: Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Docker Image Name
        id: image-name
        run: |
          if [ -n "${{ secrets.DOCKERHUB_REPO }}" ]; then
            echo "image=${{ secrets.DOCKERHUB_REPO }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/taskspring-rise" >> $GITHUB_OUTPUT
          else
            echo "image=nishathjp/taskspring-rise" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
