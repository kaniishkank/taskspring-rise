name: TaskFlow CI Verification Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mgg_taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Wait for database initialization
      run: sleep 10

    - name: Run Backend Integration Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        JWT_SECRET: super_secure_ci_test_key_123
      run: |
        cd backend
        npm install
        npx prisma db push
        npm run test

    - name: Seed Database for E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
      run: |
        cd backend
        npm run prisma:seed

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Frontend E2E Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        JWT_SECRET: super_secure_ci_test_key_123
        PORT: 4000
      run: |
        # Start backend first
        cd backend
        npm run dev &
        
        # Start frontend server
        cd ../frontend
        npm run dev -- --port 8080 &
        
        # Give both background servers 15 seconds to fully boot and stabilize
        sleep 15
        
        # Run the tests
        npx playwright test
