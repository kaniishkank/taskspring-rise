name: TaskFlow CI Verification Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mgg_taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Wait for database initialization
      run: sleep 10

    - name: Run Backend Integration Tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        DIRECT_URL: postgresql://postgres:test_password@localhost:5432/mgg_taskflow_test?schema=public
        JWT_SECRET: super_secure_ci_test_key_123
      run: |
        cd backend
        npm install
        npx prisma db push
        npm run test

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Frontend E2E Tests
      run: |
        cd frontend
        npm install
        npm run build
        npx playwright test
