name: MGG TaskFlow Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend API & Frontend E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Backend)
        run: |
          cd backend
          npm install

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/taskflow_test?schema=public"

      - name: Push Database Schema
        run: |
          cd backend
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/taskflow_test?schema=public"

      - name: Seed Database
        run: |
          cd backend
          npm run prisma:seed
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/taskflow_test?schema=public"

      - name: Run Backend Tests
        run: |
          cd backend
          npx vitest run
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/taskflow_test?schema=public"
          JWT_SECRET: "ci-test-secret"
          PORT: 4000

      - name: Install dependencies (Frontend)
        run: |
          cd frontend
          npm install

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Start Servers in Background & Run E2E Tests
        run: |
          # Start Backend Server
          cd backend
          nohup npm run dev > backend.log 2>&1 &
          
          # Start Frontend Server
          cd ../frontend
          nohup npm run dev > frontend.log 2>&1 &
          
          # Wait for servers to spin up
          sleep 12
          
          # Run Playwright E2E tests
          npx playwright test
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/taskflow_test?schema=public"
          JWT_SECRET: "ci-test-secret"
          PORT: 4000
